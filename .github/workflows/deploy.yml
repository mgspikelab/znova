name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Note: If this is a React/Vite/Node project, un-comment the lines below to build it first:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 18
      # - name: Install Dependencies & Build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3 Bucket
        run: |
          aws s3 sync . s3://dev.quantum.zedtex.us --delete --exclude ".git/*" --exclude ".github/*"
          # If deploying a built dist/out folder, change '.' above to './dist' or './build'